# End user: GitRepository in the Project namespace.
# References the AppInstallation via credentialRef; the controller resolves the
# credentials and mints a scoped token to verify access.
apiVersion: gitops.open-control-plane.io/v1alpha1
kind: GitRepository
metadata:
  name: my-infra
  namespace: my-project
spec:
  url: https://github.tools.sap/cloud-orchestration/gitops-hackaton-test
  ref:
    branch: main
  path: ./
  credentialRef:
    name: my-connection            # -> the AppInstallation above
    kind: AppInstallation
    group: github.gitops.open-control-plane.io
