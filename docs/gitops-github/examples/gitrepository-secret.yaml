# End user: GitRepository authenticating with a user-provided Secret instead of
# the platform GitHub App. The Secret lives in the same namespace as the
# GitRepository and uses the Flux (source.toolkit.fluxcd.io) key convention, so
# no key translation is needed downstream.
#
# HTTPS (Personal Access Token): keys username + password (PAT goes in password).
apiVersion: v1
kind: Secret
metadata:
  name: my-git-credentials
  namespace: my-project
type: Opaque
stringData:
  username: my-github-user
  password: github_pat_xxxxxxxxxxxxxxxxxxxx
---
# SSH alternative — keys identity + known_hosts (+ optional password passphrase):
#   identity:    <PEM private key>
#   known_hosts: <ssh-keyscan output for the host>
#
# GitRepository referencing the Secret directly.
apiVersion: gitops.open-control-plane.io/v1alpha1
kind: GitRepository
metadata:
  name: my-infra
  namespace: my-project
spec:
  url: https://github.com/my-org/my-infra
  ref:
    branch: main
  path: ./
  credentialRef:
    name: my-git-credentials       # -> the Secret above
    kind: Secret                    # group defaults to "" (core API group)
