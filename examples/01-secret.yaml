# Credential Secret (platform owner) — DUMMY values, replace before use.
# Holds the GitHub App credentials referenced by the GitHubInstance below.
apiVersion: v1
kind: Secret
metadata:
  name: sap-ghe
  namespace: platform-service-gitops-system
stringData:
  appID: "000000"                       # dummy — your real GitHub App ID
  url: https://github.tools.sap         # public github.com would be https://github.com
  privateKey: |                          # dummy — replace with your App's .pem
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME_WITH_A_REAL_GITHUB_APP_PRIVATE_KEY
    -----END RSA PRIVATE KEY-----
