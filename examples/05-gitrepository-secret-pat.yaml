# Alternative credential flow: user-provided Secret (HTTPS PAT or SSH key)
# instead of the platform GitHub App. Apply both resources below in your
# Project namespace.
#
# Unlike the AppInstallation flow (01-04), this needs no GitHubInstance and no
# platform App — you bring your own credential. Like the App flow, a kind:Secret
# GitRepository can also propagate to MCPs via propagateTo: the controller copies
# this Secret VERBATIM into each target MCP's flux-system namespace (as
# <name>-credentials) and creates a Flux GitRepository there that references it.
# Omit propagateTo to only validate access on the onboarding cluster.
#
# The Secret uses the Flux (source.toolkit.fluxcd.io) key convention:
#   HTTPS PAT: keys "username" + "password" (the PAT goes in "password").
#   SSH:       keys "identity" + "known_hosts" (optional "password" = passphrase).
---
# The credential Secret — lives in the SAME namespace as the GitRepository.
# DUMMY values, replace before use.
apiVersion: v1
kind: Secret
metadata:
  name: my-git-credentials
  namespace: my-project
type: Opaque
stringData:
  username: my-github-username                  # your GitHub username
  password: github_pat_xxxxxxxxxxxxxxxxxxxxxx   # your Personal Access Token
---
# GitRepository referencing the Secret directly via credentialRef.kind: Secret.
apiVersion: gitops.open-control-plane.io/v1alpha1
kind: GitRepository
metadata:
  name: my-infra
  namespace: my-project
spec:
  url: https://github.tools.sap/cloud-orchestration/gitops-hackaton-test
  ref:
    branch: main
  path: ./
  credentialRef:
    name: my-git-credentials       # -> the Secret above
    kind: Secret                    # group defaults to "" (core API group)
  # Optional: copy the credential + create a Flux GitRepository in these MCPs.
  # Requires the ControlPlane to exist (see examples/06-controlplane.yaml).
  propagateTo:
    - kind: ControlPlane
      name: test-mcp
