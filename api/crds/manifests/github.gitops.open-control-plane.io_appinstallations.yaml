---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
    openmcp.cloud/cluster: onboarding
  name: appinstallations.github.gitops.open-control-plane.io
spec:
  group: github.gitops.open-control-plane.io
  names:
    categories:
    - gitops
    - openmcp
    kind: AppInstallation
    listKind: AppInstallationList
    plural: appinstallations
    singular: appinstallation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceRef.name
      name: INSTANCE
      type: string
    - jsonPath: .spec.org
      name: ORG
      type: string
    - jsonPath: .status.conditions[?(@.type=='AppInstalled')].status
      name: INSTALLED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AppInstallation is the Schema for the appinstallations API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AppInstallationSpec defines the desired state of AppInstallation.

              An AppInstallation is created by an end user in a Project namespace. It links
              the Project to a GitHub App installation on the user's own GitHub org (or
              user account). Credentials are never supplied here — they are resolved from
              the referenced GitHubInstance, which the platform owner manages.
            properties:
              credentialName:
                description: |-
                  CredentialName selects which Secret from the GitHubInstance's secretRefs
                  to use. Optional when the instance lists exactly one Secret.
                type: string
              instanceRef:
                description: InstanceRef selects the GitHubInstance that holds the
                  credentials.
                properties:
                  name:
                    description: Name of the (cluster-scoped) GitHubInstance.
                    type: string
                required:
                - name
                type: object
              org:
                description: |-
                  Org is the GitHub organization to check the App installation for.
                  Exactly one of org or user must be set.
                type: string
              user:
                description: |-
                  User is the GitHub user account to check the App installation for.
                  Exactly one of org or user must be set.
                type: string
            required:
            - instanceRef
            type: object
          status:
            description: AppInstallationStatus defines the observed state of AppInstallation.
            properties:
              conditions:
                description: |-
                  Conditions summarise the current state.
                  Known types: AppInstalled, AccessVerified.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              installationID:
                description: |-
                  InstallationID is the numeric GitHub App installation ID discovered for
                  the target org or user. Zero when the App is not installed.
                format: int64
                type: integer
              lastChecked:
                description: LastChecked is the time the installation state was last
                  verified.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
