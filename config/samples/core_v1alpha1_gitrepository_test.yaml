# GitRepository — points at the hackathon test repo on github.tools.sap and
# resolves credentials via the AppInstallation "my-connection" created earlier.
apiVersion: gitops.open-control-plane.io/v1alpha1
kind: GitRepository
metadata:
  name: gitops-hackaton-test
  namespace: my-project
spec:
  url: https://github.tools.sap/cloud-orchestration/gitops-hackaton-test
  ref:
    branch: main
  path: ./
  credentialRef:
    name: my-connection
    kind: AppInstallation
    group: github.gitops.open-control-plane.io
