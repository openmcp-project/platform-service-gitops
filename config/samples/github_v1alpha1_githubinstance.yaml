# Credential Secret — created once by the platform owner.
# The GitHubInstance below references it; end users never see it.
apiVersion: v1
kind: Secret
metadata:
  name: sap-ghe
  namespace: platform-service-gitops-system
stringData:
  appID: "1436"
  url: https://github.tools.sap        # public would be https://github.com
  privateKey: |
    -----BEGIN RSA PRIVATE KEY-----
    # ... the GitHub App private key (.pem) ...
    -----END RSA PRIVATE KEY-----
---
apiVersion: github.gitops.open-control-plane.io/v1alpha1
kind: GitHubInstance
metadata:
  labels:
    app.kubernetes.io/name: platform-service-gitops
    app.kubernetes.io/managed-by: kustomize
  name: sap-ghe
spec:
  secretRefs:
    - name: sap-ghe
      # namespace defaults to the controller's --credential-namespace when omitted
