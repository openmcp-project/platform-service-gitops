apiVersion: gitops.open-control-plane.io/v1alpha1
kind: GitRepository
metadata:
  name: my-infra
  namespace: default
spec:
  url: https://github.com/my-org/my-infra
  ref:
    branch: main
  path: ./
  credentialRef:
    name: my-github-connection
    kind: AppInstallation
    group: github.gitops.open-control-plane.io
  propagateTo:
    # Explicit ControlPlane by name. namespace is required and, together with the
    # name, uniquely identifies the target MCP.
    - kind: ControlPlane
      namespace: team-a
      name: my-mcp-prod
    # Same ControlPlane name in a different namespace is a distinct target.
    - kind: ControlPlane
      namespace: team-b
      name: my-mcp-prod
    # Select ControlPlanes by label within the given namespace.
    # Mutually exclusive with name.
    - kind: ControlPlane
      namespace: team-a
      matchLabels:
        environment: staging
        team: platform
