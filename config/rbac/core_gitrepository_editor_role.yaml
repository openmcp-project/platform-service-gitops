# This rule is not used by the project platform-service-gitops itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the core.openmcp.cloud.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platform-service-gitops
    app.kubernetes.io/managed-by: kustomize
  name: core-gitrepository-editor-role
rules:
- apiGroups:
  - core.openmcp.cloud
  resources:
  - gitrepositories
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.openmcp.cloud
  resources:
  - gitrepositories/status
  verbs:
  - get
