---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - gitops.open-control-plane.io
  resources:
  - gitrepositories
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gitops.open-control-plane.io
  resources:
  - gitrepositories/finalizers
  verbs:
  - update
- apiGroups:
  - gitops.open-control-plane.io
  resources:
  - gitrepositories/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - github.gitops.open-control-plane.io
  resources:
  - appinstallations
  - githubinstances
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - github.gitops.open-control-plane.io
  resources:
  - appinstallations/status
  - githubinstances/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
# Permissions for init command: install CRDs and manage cluster access requests
- apiGroups:
  - clusters.openmcp.cloud
  resources:
  - clusterrequests
  - accessrequests
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
