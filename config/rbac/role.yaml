---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - gitops.open-control-plane.io
  resources:
  - gitrepositories
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gitops.open-control-plane.io
  resources:
  - gitrepositories/finalizers
  verbs:
  - update
- apiGroups:
  - gitops.open-control-plane.io
  resources:
  - gitrepositories/status
  verbs:
  - get
  - patch
  - update
